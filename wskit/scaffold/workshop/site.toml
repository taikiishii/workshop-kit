# =========================================================================
# site.toml  --  この教材だけのちがいを集めた設定
#
# 共通のしくみ（build の手順・CSS・JS・テンプレート）は workshop-kit 側にある。
# ここに無いものを変えたくなったら、kit を直す＝ぜんぶの教材に効く、と考える。
# =========================================================================

[site]
name         = "{{NAME}}"                       # もくじの <title> と表紙に使う教材名
header       = "✨ {{NAME}}"                    # もくじの大見出し（絵文字を頭に置くとよい）
base_url     = "https://example.github.io/{{SLUG}}/"   # 公開URL。必ず / で終わる
title_suffix = " — {{NAME}}"                    # 章ページの <title> のうしろに付く文字
# logo       = "board.png"                      # 見出しの頭に画像を置くとき（assets/ に入れる）

accent        = "#00a99d"   # テーマ色
accent_dark   = "#007c74"   # 濃いほう（見出しの背景・リンク）
accent_bright = "#00b5a8"   # 明るいほう（ヘッダーのグラデーション）

# ---- もくじカードの枠色 ---------------------------------------------------
# frontmatter の color: がこのキーを引く。セクションごとに色を変えると見分けやすい。
[palette]
c1 = "#ffb3c1"
c2 = "#ffd98a"
c3 = "#a7e3a7"
c4 = "#9fd8f0"
c5 = "#c9b3e8"

# 難易度ラベル（frontmatter に level: を書いた章だけ）を使うなら、
# その章の color: と同じキーで背景色を決める。
# [palette.level]
# c1 = "#5bb85b"

# ---- もくじのセクション ---------------------------------------------------
# 並べた順に表示される。name は frontmatter の section: と一致させる。
[[sections]]
name  = "基本編"
cls   = "s-basic"
title = "🔰 基本編"
sub   = "まずはここから"
line  = ["#ffb3c1", "#ffd98a", "#a7e3a7"]   # 区切り線のグラデーション

# ---- コードの色分け -------------------------------------------------------
# その教材でよく出てくる関数・グループ名。コードの中で青く表示される。
[code]
namespaces = []

# ---- 博士の吹き出し -------------------------------------------------------
[mascot]
auto     = true   # 短い吹き出しは顔だけのアイコンにする
full_min = 60     # この文字数以上なら全身。>> ／ >| で個別に上書きできる

[license]
copyright = "Copyright © 2026 Your Name"
