[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-kit"
version = "1.0.0"
description = "ワークショップ教材サイト（content/ → docs/）の共通ビルド"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["segno>=1.5", "pillow>=9"]

[tool.setuptools]
packages = ["wskit"]

[tool.setuptools.package-data]
wskit = [
  "assets/*",
  "templates/*",
  "files/*",
  "scaffold/chapter/*",
  "scaffold/workshop/*",
]
